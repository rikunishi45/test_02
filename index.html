<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>家計簿</title>
    <style>
      /*
       * 配色はここに集約する。コンポーネント側は var() を参照するだけにして、
       * 明暗どちらのテーマでも読める状態を1か所で担保する。
       * （最初これを書かずに文字色だけ濃色で固定したところ、ダークモードの
       *   ブラウザで背景と同化してほぼ読めなかった）
       */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #f6f7fb;
        --fg: #1b1f2a;
        --muted: #5b6376;
        --line: #d8dce6;
        --accent: #2f4858;
        --accent-fg: #ffffff;
        --dup: #fff8e1;
        --error: #fff3e0;
        --success: #e8f5e9;
        --danger: #b8492f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171d;
          --surface: #1c2029;
          --fg: #e7eaf2;
          --muted: #98a0b3;
          --line: #2c3340;
          --accent: #7aa2c2;
          --accent-fg: #10141a;
          --dup: #33301f;
          --error: #3a2a1c;
          --success: #1e3125;
          --danger: #e0806c;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      input,
      select,
      button {
        font: inherit;
        color: var(--fg);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 6px;
      }
      button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
