<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>家計簿</title>
    <style>
      /*
       * 配色はここに集約する。コンポーネント側は var() を参照するだけ。
       *
       * **単一テーマ（黒背景）にする。** 明暗の両対応をやめたのは、配色を
       * 「黒背景・緑アクセント」で決めたため（2026-08-10）。両方を作ると
       * どちらも中途半端に検証されない状態になる。`color-scheme` を dark に
       * 固定して、フォームのネイティブ部品も暗い側に寄せる。
       *
       * 地の黒は緑に寄せてある。純黒だとカード面との段差が出ず、中間グレーだと
       * 既製テンプレートに見える。
       */
      :root {
        color-scheme: dark;
        --bg: #0a0d0c;
        --surface: #121714;
        --surface-2: #19211d;
        --fg: #e6ede9;
        --muted: #8b9a93;
        --faint: #5d6b64;
        --line: #232e28;
        --accent: #2fbf6b;
        --accent-fg: #06120b;
        /* アクセントの緑と収入の緑は別にする。同じだとボタンと金額が同じ意味に見える */
        --income: #3ddc97;
        --bar: #2a8f57;
        --dup: #2e2a16;
        --error: #2e1a1a;
        --success: #12261b;
        --danger: #ef6a6a;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP",
          system-ui, sans-serif;
      }
      input,
      select,
      button {
        font: inherit;
        color: var(--fg);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /*
       * 骨格だけクラスで書く。他のコンポーネントはインラインスタイルのままだが、
       * メディアクエリと :hover はインラインでは書けないため。
       */
      .shell {
        display: grid;
        grid-template-columns: 200px 1fr;
        min-height: 100vh;
      }
      .rail {
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 18px 12px;
      }
      .rail-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px 18px;
        font-weight: 700;
      }
      .rail-mark {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: rgba(47, 191, 107, 0.14);
        border: 1px solid #1d7c45;
        color: var(--accent);
        display: grid;
        place-items: center;
        font-size: 13px;
      }
      .rail-item {
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: 100%;
        padding: 8px 10px;
        margin-bottom: 2px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        text-align: left;
      }
      .rail-item:hover {
        background: var(--surface-2);
        color: var(--fg);
      }
      .rail-item[aria-current="page"] {
        background: rgba(47, 191, 107, 0.13);
        color: var(--accent);
        font-weight: 600;
      }
      .rail-count {
        margin-left: auto;
        font-size: 12px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .rail-sep {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 12px 6px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 24px;
        border-bottom: 1px solid var(--line);
      }
      .topbar h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 650;
      }
      /* グリッドの子は既定で中身より狭くならない（min-width: auto）。これが無いと、
         中で overflow-x を持たせた表が縮まずに列を押し出し、ページ全体が横に伸びて
         右端の操作に手が届かなくなる。 */
      .pane {
        min-width: 0;
      }
      .content {
        padding: 20px 24px 64px;
        max-width: 1100px;
        min-width: 0;
      }

      @media (max-width: 720px) {
        .shell {
          grid-template-columns: 1fr;
          /* auto 行だけだと余白が両方の行に配られ、横並びのレールが縦に伸びる */
          grid-template-rows: auto 1fr;
        }
        .rail {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          display: flex;
          align-items: center;
          gap: 4px;
          overflow-x: auto;
          padding: 10px;
        }
        .rail-brand,
        .rail-sep {
          display: none;
        }
        .rail-item {
          width: auto;
          white-space: nowrap;
          margin-bottom: 0;
        }
        .rail-count {
          margin-left: 4px;
        }
        .content {
          padding: 16px 14px 48px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
