name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # この name もルールセットの context。secret-scan と同じ注意が要る。
    name: テスト
    runs-on: ubuntu-latest
    # ハングしたテストがジョブを6時間占有するのを防ぐ。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: テストを実行する
        # fail closed。src/ に人間のレビューは入らないため、テストがCIの唯一の壁になる。
        # 壁の定義（run-tests.sh）は保護パスに置いてある。ここをAIが自由に書けると
        # 中身を exit 0 にして壁を無効化できるため。
        #
        # src/ が無い始動直後は通る。最初の実装コードで初めて強制される。
        run: |
          set -euo pipefail
          if [ -x ./run-tests.sh ]; then
            ./run-tests.sh
          elif [ -e ./run-tests.sh ]; then
            echo "::error::run-tests.sh に実行権限が無い。chmod +x して commit すること。"
            exit 1
          elif [ -d src ]; then
            echo "::error::src/ があるのに run-tests.sh が無い。src/ に人間のレビューは"
            echo "::error::入らないため、テストがCIの唯一の壁になる。run-tests.sh を追加すること。"
            exit 1
          else
            echo "src/ も run-tests.sh も無い。検証対象なし。"
          fi

  secret-scan:
    # この name はルールセット main-ci の required_status_checks に
    # context として文字列で登録してある。変えるとチェックが永久に
    # 報告されなくなり、全PRがマージ不能で固まる。
    # 変えるときは .github/rulesets/main-ci.json とGitHub側の両方を同時に直す。
    name: 秘密情報スキャン
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks を実行する
        # gitleaks-action は実行ごとにGitHub APIでアカウント種別を判定し、その通信が
        # 失敗するとライセンス必須へフォールバックして落ちる。必須チェックが外部通信の
        # 不調でランダムに失敗し、しかも「秘密情報を検出した」と区別できない形で落ちる。
        # バイナリを直接実行してライセンス判定を経由しない。
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          # `git` は履歴全体をスキャンする。`detect` は deprecated。
          # --redact で検出値をログに出さない。
          /tmp/gitleaks git . --no-banner --redact
