name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: 秘密情報スキャン
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks を実行する
        # gitleaks-action は実行ごとにGitHub APIでアカウント種別を判定し、その通信が
        # 失敗するとライセンス必須へフォールバックして落ちる。必須チェックが外部通信の
        # 不調でランダムに失敗し、しかも「秘密情報を検出した」と区別できない形で落ちる。
        # バイナリを直接実行してライセンス判定を経由しない。
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          # `git` は履歴全体をスキャンする。`detect` は deprecated。
          # --redact で検出値をログに出さない。
          /tmp/gitleaks git . --no-banner --redact
